# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # Enable npm dependencies
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Allow Dependabot to create up to 10 PRs at once
    open-pull-requests-limit: 10
    # Automatically rebasing and squashing when possible
    rebase-strategy: "auto"
    # Commit message customization
    commit-message:
      # Prefix commit messages with "deps:" for easier identification
      prefix: "deps"
      # Include the dependency scope in commit messages
      include: "scope"
    # Ignore specific dependencies if needed (uncomment to use)
    # ignore:
    #   - dependency-name: "lodash"
    #     versions: ["<4.0.0"]
 
